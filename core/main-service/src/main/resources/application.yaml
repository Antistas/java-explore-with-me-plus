spring:
  application:
    name: main-service
  # Все остальные настройки сервис получает от config-server
  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        # Адрес config-server берётся из Eureka
        enabled: true
        service-id: config-server
      # Без настроек сервис не запускается, но ждёт появления config-server в реестре
      fail-fast: true
      retry:
        initial-interval: 2000
        max-interval: 5000
        multiplier: 1.5
        max-attempts: 20

# Адрес Eureka нужен локально: через неё ищется сам config-server
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
