spring:
  application:
    name: discovery-server

server:
  port: 8761

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # Сервер обнаружения работает в единственном экземпляре:
    # сам себя не регистрирует и реестр у других узлов не запрашивает
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Кэш ответов реестра обновляется раз в 5 с вместо 30 с:
    # новые экземпляры сервисов становятся видны клиентам быстрее
    response-cache-update-interval-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
